name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats cards
        run: node .github/scripts/generate-stats.mjs
        env:
          # STATS_TOKEN (your personal token) adds private contributions;
          # without it, the built-in token counts public activity only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
